<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMA dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    /* colours: light mode first, dark mode replaces them below */
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #1d2125;
      --muted: #5f6b76;
      --line: #dde1e5;
      --grid: #eceff1;
      --open: #0b7a53;
      --accent: #2f5fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #15181c;
        --text: #e6e9ec;
        --muted: #98a2ad;
        --line: #2c3238;
        --grid: #22272c;
        --open: #3ecf8e;
        --accent: #7ea2ff;
      }
    }

    body {
      margin: 0 auto;
      max-width: 1600px;
      padding: 32px 24px 64px;
      background: var(--background);
      color: var(--text);
      /* Apple's system font (SF Pro) on Mac, iPhone and iPad, a similar font everywhere else */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 32px; margin: 0 0 4px; }
    h2 { font-size: 24px; margin: 0 0 12px; }
    p { margin: 8px 0 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    section { margin-top: 56px; }

    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
    td { white-space: nowrap; }   /* numbers stay on one line, the headers may wrap onto two */
    th:first-child, td:first-child { text-align: left; white-space: normal; }
    th { font-weight: 600; color: var(--muted); }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--grid); }
    .open { color: var(--open); font-weight: 600; }
    .closed { color: var(--muted); }

    select {
      margin-top: 24px;
      font: inherit;
      padding: 6px 10px;
      color: var(--text);
      background: var(--background);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .chart { margin-top: 12px; }

    footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--line); }

    /* smaller screens: hide columns step by step so the table always fits */
    @media (max-width: 1240px) { .hide-1240 { display: none; } }
    @media (max-width: 720px) {
      .hide-720 { display: none; }
      body { padding: 24px 16px 48px; }
    }
    @media (max-width: 480px) {
      .hide-480 { display: none; }
      table { font-size: 14px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <h1>SMA dashboard</h1>
  <p class="muted" id="updated">Loading data...</p>

  <div id="sections"></div>

  <footer>
    <a href="https://github.com/pedrosalgado22/SMAstrategy">View the code on GitHub</a>
  </footer>

  <script>
    const SMA_WIDTH = 2;       // line thickness of the SMA 50, 100 and 200 lines
    const OPTIMAL_WIDTH = 3;   // line thickness of the optimal SMA line

    const TABLE_HEAD =
      "<thead><tr>" +
      "<th>Name</th><th>Last close</th><th class='hide-1240'>Date</th><th class='hide-720'>Optimal SMA (band)</th>" +
      "<th class='hide-480'>SMA value</th><th>Distance</th><th>Status</th><th class='hide-1240'>Days in status</th>" +
      "<th class='hide-1240'>SMA 50</th><th class='hide-1240'>SMA 100</th><th class='hide-1240'>SMA 200</th>" +
      "</tr></thead>";


    function format(number) {
      // 7744.06 -> "7,744.06"
      return number.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }


    function makeElement(tag, text, className) {
      const element = document.createElement(tag);
      if (text) {
        element.textContent = text;
      }
      if (className) {
        element.className = className;
      }
      return element;
    }


    function addCell(row, text, className) {
      const cell = row.insertCell();
      cell.textContent = text;
      if (className) {
        cell.className = className;
      }
    }


    function addRow(tbody, entry, index, view) {
      const latest = entry.latest;
      const row = tbody.insertRow();

      row.onclick = function () {   // clicking a row shows its chart
        view.picker.value = index;
        drawChart(view);
      };

      let sign = "";
      if (latest.distance_pct > 0) {
        sign = "+";
      }

      addCell(row, entry.name);
      addCell(row, format(latest.close));
      addCell(row, latest.date, "hide-1240");
      addCell(row, entry.n + " (" + entry.low_n + " to " + entry.high_n + ")", "hide-720");
      addCell(row, format(latest.sma_n), "hide-480");
      addCell(row, sign + format(latest.distance_pct) + "%");
      if (latest.is_open) {
        addCell(row, "Open", "open");
      } else {
        addCell(row, "Closed", "closed");
      }
      addCell(row, latest.days_in_state, "hide-1240");
      addCell(row, format(latest.sma_50), "hide-1240");
      addCell(row, format(latest.sma_100), "hide-1240");
      addCell(row, format(latest.sma_200), "hide-1240");
    }


    function drawChart(view) {
      // view holds the parts of one section: its group of tickers, dropdown, chart box and text line
      const entry = view.group.entries[view.picker.value];
      const s = entry.series;
      const style = getComputedStyle(document.documentElement);
      const textColor = style.getPropertyValue("--text").trim();
      const gridColor = style.getPropertyValue("--grid").trim();
      const accent = style.getPropertyValue("--accent").trim();
      const fontFamily = getComputedStyle(document.body).fontFamily;

      const traces = [
        // the band: an invisible lower line, then the upper line filled down to it
        { x: s.dates, y: s.sma_low, mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
        { x: s.dates, y: s.sma_high, name: "SMA " + entry.low_n + " to " + entry.high_n, mode: "lines",
          line: { width: 0 }, fill: "tonexty", fillcolor: "rgba(80, 120, 220, 0.18)", hoverinfo: "skip" },

        { x: s.dates, y: s.close, name: "Close", mode: "lines", line: { color: textColor, width: 1.5 } },
        { x: s.dates, y: s.sma_50, name: "SMA 50", mode: "lines", line: { color: "#d4a017", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_100, name: "SMA 100", mode: "lines", line: { color: "#2e9e4f", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_200, name: "SMA 200", mode: "lines", line: { color: "#d64545", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_n, name: "SMA " + entry.n + " (optimal)", mode: "lines",
          line: { color: accent, width: OPTIMAL_WIDTH } },

        { x: [entry.latest.date], y: [entry.latest.close], name: "Last close", mode: "markers",
          marker: { size: 10, color: textColor } }
      ];

      const layout = {
        height: 520,
        margin: { t: 48, r: 16, b: 40, l: 64 },
        title: { text: entry.name + ": close and SMAs" },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: textColor, family: fontFamily },
        hovermode: "x unified",
        hoverlabel: { bgcolor: "#ffffff", font: { color: "#000000" } },   // the box shown on hover: white with black text
        legend: { orientation: "h", y: -0.15 },
        xaxis: { gridcolor: gridColor },
        yaxis: { gridcolor: gridColor, separatethousands: true }
      };

      Plotly.newPlot(view.chart, traces, layout, { responsive: true });

      // the line under the chart: how many SMA lengths beat dollar cost averaging
      if (entry.beat_dca_pct === null) {
        view.beatLine.textContent = "";
      } else {
        view.beatLine.textContent =
          "For " + entry.name + ", " + Math.round(entry.beat_dca_pct) + "% of the SMA lengths from 2 to 200 beat dollar cost averaging.";
      }
    }


    function addSection(parent, group) {
      // one section of the page: title, table, note, dropdown, chart and text line
      const section = makeElement("section");
      parent.appendChild(section);   // attach first, the chart needs to be on the page to get its size
      section.appendChild(makeElement("h2", group.title));

      if (group.skipped.length > 0) {
        section.appendChild(makeElement("p", "Could not update: " + group.skipped.join(", ") + ".", "muted"));
      }
      if (group.entries.length === 0) {
        section.appendChild(makeElement("p", "Nothing to show yet.", "muted"));
        return;
      }

      const view = {
        group: group,
        picker: makeElement("select"),
        chart: makeElement("div", "", "chart"),
        beatLine: makeElement("p", "", "muted")
      };
      view.picker.setAttribute("aria-label", "Choose from " + group.title);

      const table = makeElement("table");
      table.innerHTML = TABLE_HEAD;
      const tbody = makeElement("tbody");
      table.appendChild(tbody);
      for (let i = 0; i < group.entries.length; i++) {
        addRow(tbody, group.entries[i], i, view);
        view.picker.add(new Option(group.entries[i].name, i));
      }

      const wrap = makeElement("div", "", "table-wrap");
      wrap.appendChild(table);
      section.appendChild(wrap);
      section.appendChild(makeElement("p",
        "Open means the last close is at or below the optimal SMA, the buy rule from the backtest. " +
        "Closed means it is above. Click a row to show its chart.", "muted"));
      section.appendChild(view.picker);
      section.appendChild(view.chart);
      section.appendChild(view.beatLine);

      view.picker.onchange = function () {
        drawChart(view);
      };
      drawChart(view);
    }


    function showPage(data) {
      document.getElementById("updated").textContent = "Updated " + data.updated + " from the daily closing prices.";
      const sections = document.getElementById("sections");
      for (let i = 0; i < data.groups.length; i++) {
        addSection(sections, data.groups[i]);
      }
    }


    fetch("data.json", { cache: "no-store" })
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        showPage(data);
      })
      .catch(function (error) {
        document.getElementById("updated").textContent =
          "Could not load the dashboard (" + error.message + "). If you opened this file directly, " +
          "run: python -m http.server (inside the docs folder) and open http://localhost:8000.";
      });
  </script>
</body>
</html>
