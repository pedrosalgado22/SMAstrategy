<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMA dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    /* colours: light mode first, dark mode replaces them below */
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #1d2125;
      --muted: #5f6b76;
      --line: #dde1e5;
      --grid: #eceff1;
      --open: #0b7a53;
      --accent: #2f5fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #15181c;
        --text: #e6e9ec;
        --muted: #98a2ad;
        --line: #2c3238;
        --grid: #22272c;
        --open: #3ecf8e;
        --accent: #7ea2ff;
      }
    }

    body {
      margin: 0 auto;
      max-width: 1800px;
      padding: 32px 4vw 64px;
      background: var(--background);
      color: var(--text);
      /* Apple's system font (SF Pro) on Mac, iPhone and iPad, a similar font everywhere else */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 32px; margin: 0 0 4px; }
    h2 { font-size: 24px; margin: 0 0 12px; }
    p { margin: 8px 0 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    section { margin-top: 56px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    .sorter { color: var(--muted); font-size: 14px; }
    .sorter select { margin-top: 0; margin-left: 6px; }

    .table-wrap { margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    th { font-weight: 600; color: var(--muted); white-space: normal; }
    th { cursor: pointer; user-select: none; }   /* column titles are clickable: they sort the table */
    th:hover { color: var(--text); }
    th.desc::after { content: "\00A0\25BC"; }   /* arrow down: sorted high to low */
    th.asc::after { content: "\00A0\25B2"; }    /* arrow up: sorted low to high */
    @media (max-width: 359px) {   /* very small phones: the arrow may wrap under the title so the table still fits */
      th.desc::after { content: " \25BC"; }
      th.asc::after { content: " \25B2"; }
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--grid); }
    .open { color: var(--open); font-weight: 600; }
    .closed { color: var(--muted); }

    /* narrower screens hide the least important columns, so the table never needs to scroll */
    @media (max-width: 1400px) {   /* hides SMA 50, SMA 100, SMA 200 */
      th:nth-child(n+9), td:nth-child(n+9) { display: none; }
    }
    @media (max-width: 1100px) {   /* also hides Date and SMA value */
      th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5) { display: none; }
    }
    @media (max-width: 900px) {    /* also hides Optimal SMA (band) and Days in status */
      th:nth-child(4), td:nth-child(4), th:nth-child(8), td:nth-child(8) { display: none; }
    }
    @media (max-width: 600px) {    /* phones: tighter table, long names may wrap */
      table { font-size: 14px; }
      th, td { padding: 8px 6px; }
      td:first-child { white-space: normal; }
      .sorter .hint { display: none; }
    }

    select {
      margin-top: 24px;
      font: inherit;
      padding: 6px 10px;
      color: var(--text);
      background: var(--background);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .chart { margin-top: 12px; }

    /* the line above the chart: title in the middle, time frame dropdown on the right */
    .chart-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 12px; }
    .chart-title { font-size: 21px; text-align: center; }
    .time-picker { justify-self: end; color: var(--muted); font-size: 14px; }
    .time-picker select { margin-top: 0; margin-left: 6px; }
    @media (max-width: 700px) {   /* narrow screens: the title may take its own line, the dropdown stays on the right */
      .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
      .time-picker { margin-left: auto; }
    }

    footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <h1>SMA dashboard</h1>
  <p class="muted" id="updated">Loading data...</p>

  <div id="sections"></div>

  <footer>
    <a href="https://github.com/pedrosalgado22/SMAstrategy">View the code on GitHub</a>
  </footer>

  <script>
    const SMA_WIDTH = 2;       // line thickness of the SMA 50, 100 and 200 lines
    const OPTIMAL_WIDTH = 3;   // line thickness of the optimal SMA line

    const TABLE_HEAD =
      "<thead><tr>" +
      "<th>Name</th><th>Last close</th><th>Date</th><th>Optimal SMA (band)</th><th>SMA value</th>" +
      "<th>Distance</th><th>Status</th><th>Days in status</th><th>SMA 50</th><th>SMA 100</th><th>SMA 200</th>" +
      "</tr></thead>";

    // what each column title sorts by, in the same order as TABLE_HEAD
    const COLUMN_KEYS = ["name", "close", "date", "n", "sma_n", "distance_pct", "is_open", "days_in_state", "sma_50", "sma_100", "sma_200"];

    // time frames of the chart: the text in the dropdown, then how many months back from the last date (0 = all the data)
    const TIME_OPTIONS = [
      ["1 month", 1],
      ["3 months", 3],
      ["6 months", 6],
      ["1 year", 12],
      ["All", 0]
    ];

    // what the table can be sorted by with the dropdown (high to low): the text in the dropdown, then what is sorted
    const SORT_OPTIONS = [
      ["Default order", "default"],
      ["Status", "is_open"],
      ["Days in status", "days_in_state"],
      ["Distance", "distance_pct"],
      ["Last close", "close"],
      ["Optimal SMA", "n"],
      ["SMA value", "sma_n"],
      ["SMA 50", "sma_50"],
      ["SMA 100", "sma_100"],
      ["SMA 200", "sma_200"],
      ["Date", "date"],
      ["Name", "name"]
    ];


    function format(number) {
      // 7744.06 -> "7,744.06"
      return number.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }


    function makeElement(tag, text, className) {
      const element = document.createElement(tag);
      if (text) {
        element.textContent = text;
      }
      if (className) {
        element.className = className;
      }
      return element;
    }


    function addCell(row, text, className) {
      const cell = row.insertCell();
      cell.textContent = text;
      if (className) {
        cell.className = className;
      }
    }


    function addRow(tbody, entry, index, view) {
      const latest = entry.latest;
      const row = tbody.insertRow();

      row.onclick = function () {   // clicking a row shows its chart
        view.picker.value = index;
        drawChart(view);
      };

      let sign = "";
      if (latest.distance_pct > 0) {
        sign = "+";
      }

      addCell(row, entry.name);
      addCell(row, format(latest.close));
      addCell(row, latest.date);
      addCell(row, entry.n + " (" + entry.low_n + " to " + entry.high_n + ")");
      addCell(row, format(latest.sma_n));
      addCell(row, sign + format(latest.distance_pct) + "%");
      if (latest.is_open) {
        addCell(row, "Open", "open");
      } else {
        addCell(row, "Closed", "closed");
      }
      addCell(row, latest.days_in_state);
      addCell(row, format(latest.sma_50));
      addCell(row, format(latest.sma_100));
      addCell(row, format(latest.sma_200));
    }


    function sortValue(entry, key) {
      // the value of one entry that the table is sorted by
      if (key === "name") {
        return entry.name;
      }
      if (key === "n") {
        return entry.n;
      }
      if (key === "is_open") {
        if (entry.latest.is_open) {
          return 1;
        }
        return 0;
      }
      return entry.latest[key];   // close, date, sma_n, distance_pct, days_in_state, sma_50, sma_100, sma_200
    }


    function fillTable(view) {
      // fills the table with the rows, sorted by view.sortKey: high to low, or low to high
      const entries = view.group.entries;
      const order = [];
      for (let i = 0; i < entries.length; i++) {
        order.push(i);
      }
      if (view.sortKey !== "default") {
        let direction = 1;
        if (view.sortDescending) {
          direction = -1;
        }
        order.sort(function (a, b) {
          const first = sortValue(entries[a], view.sortKey);
          const second = sortValue(entries[b], view.sortKey);
          if (first > second) {
            return direction;
          }
          if (first < second) {
            return -direction;
          }
          return a - b;   // same value: keep the original order
        });
      }
      view.tbody.innerHTML = "";
      for (let i = 0; i < order.length; i++) {
        addRow(view.tbody, entries[order[i]], order[i], view);   // order[i] is the place of the entry in the original list, so a click still shows the right chart
      }
    }


    function applySort(view) {
      // sorts the table, then shows how: an arrow on the sorted column title, the dropdown and its hint
      fillTable(view);
      const titles = view.table.tHead.rows[0].cells;
      for (let i = 0; i < titles.length; i++) {
        titles[i].classList.remove("desc");
        titles[i].classList.remove("asc");
        if (COLUMN_KEYS[i] === view.sortKey) {
          if (view.sortDescending) {
            titles[i].classList.add("desc");
          } else {
            titles[i].classList.add("asc");
          }
        }
      }
      view.sortPicker.value = view.sortKey;
      if (view.sortDescending) {
        view.hint.textContent = " (descending)";
      } else {
        view.hint.textContent = " (ascending)";
      }
    }


    function makeSortable(view) {
      // clicking a column title sorts by that column: the first click high to low, the next click low to high
      const titles = view.table.tHead.rows[0].cells;
      for (let i = 0; i < titles.length; i++) {
        const key = COLUMN_KEYS[i];
        titles[i].onclick = function () {
          if (view.sortKey === key) {
            view.sortDescending = !view.sortDescending;
          } else {
            view.sortKey = key;
            view.sortDescending = true;
          }
          applySort(view);
        };
      }
    }


    function drawChart(view) {
      // view holds the parts of one section: its group of tickers, dropdown, chart box and text line
      const entry = view.group.entries[view.picker.value];

      // the time frame: keep only the days from that many months before the last date
      const full = entry.series;
      const months = Number(view.timePicker.value);
      let start = 0;
      if (months > 0) {
        const cutoff = new Date(full.dates[full.dates.length - 1]);
        cutoff.setUTCMonth(cutoff.getUTCMonth() - months);
        const cutoffText = cutoff.toISOString().slice(0, 10);   // for example "2026-04-16"
        while (full.dates[start] < cutoffText) {
          start++;
        }
      }
      const s = {};
      for (const key in full) {
        s[key] = full[key].slice(start);
      }
      view.chartTitle.textContent = entry.name + ": close and SMAs";
      const style = getComputedStyle(document.documentElement);
      const textColor = style.getPropertyValue("--text").trim();
      const gridColor = style.getPropertyValue("--grid").trim();
      const accent = style.getPropertyValue("--accent").trim();
      const fontFamily = getComputedStyle(document.body).fontFamily;

      const traces = [
        // the band: an invisible lower line, then the upper line filled down to it
        { x: s.dates, y: s.sma_low, mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
        { x: s.dates, y: s.sma_high, name: "SMA " + entry.low_n + " to " + entry.high_n, mode: "lines",
          line: { width: 0 }, fill: "tonexty", fillcolor: "rgba(80, 120, 220, 0.18)", hoverinfo: "skip" },

        { x: s.dates, y: s.close, name: "Close", mode: "lines", line: { color: textColor, width: 1.5 } },
        { x: s.dates, y: s.sma_50, name: "SMA 50", mode: "lines", line: { color: "#d4a017", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_100, name: "SMA 100", mode: "lines", line: { color: "#2e9e4f", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_200, name: "SMA 200", mode: "lines", line: { color: "#d64545", width: SMA_WIDTH } },
        { x: s.dates, y: s.sma_n, name: "SMA " + entry.n + " (optimal)", mode: "lines",
          line: { color: accent, width: OPTIMAL_WIDTH } },

        { x: [entry.latest.date], y: [entry.latest.close], name: "Last close", mode: "markers",
          marker: { size: 10, color: textColor } }
      ];

      const layout = {
        height: 520,
        margin: { t: 16, r: 16, b: 40, l: 64 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: textColor, family: fontFamily },
        hovermode: "x unified",
        hoverlabel: { bgcolor: "#ffffff", font: { color: "#000000" } },   // the box shown on hover: white with black text
        legend: { orientation: "h", y: -0.15 },
        xaxis: { gridcolor: gridColor },
        yaxis: { gridcolor: gridColor, separatethousands: true }
      };

      Plotly.newPlot(view.chart, traces, layout, { responsive: true });

      // the line under the chart: how many SMA lengths beat dollar cost averaging
      if (entry.beat_dca_pct === null) {
        view.beatLine.textContent = "";
      } else {
        view.beatLine.textContent =
          "For " + entry.name + ", " + Math.round(entry.beat_dca_pct) + "% of the SMA lengths from 2 to 200 beat dollar cost averaging.";
      }
    }


    function addSection(parent, group) {
      // one section of the page: title, table, note, dropdown, chart and text line
      const section = makeElement("section");
      parent.appendChild(section);   // attach first, the chart needs to be on the page to get its size
      const head = makeElement("div", "", "section-head");   // the title line: title on the left, sort dropdown on the right
      head.appendChild(makeElement("h2", group.title));
      section.appendChild(head);

      if (group.skipped.length > 0) {
        section.appendChild(makeElement("p", "Could not update: " + group.skipped.join(", ") + ".", "muted"));
      }
      if (group.entries.length === 0) {
        section.appendChild(makeElement("p", "Nothing to show yet.", "muted"));
        return;
      }

      const view = {
        group: group,
        picker: makeElement("select"),
        chart: makeElement("div", "", "chart"),
        beatLine: makeElement("p", "", "muted")
      };
      view.picker.setAttribute("aria-label", "Choose from " + group.title);

      const table = makeElement("table");
      table.innerHTML = TABLE_HEAD;
      const tbody = makeElement("tbody");
      table.appendChild(tbody);
      for (let i = 0; i < group.entries.length; i++) {
        addRow(tbody, group.entries[i], i, view);
        view.picker.add(new Option(group.entries[i].name, i));
      }
      view.table = table;
      view.tbody = tbody;
      view.sortKey = "default";
      view.sortDescending = true;
      makeSortable(view);

      const sorter = makeElement("label", "", "sorter");
      sorter.appendChild(makeElement("span", "Sort by"));
      view.hint = makeElement("span", " (descending)", "hint");   // hidden on phones so the title and the dropdown fit on one line
      sorter.appendChild(view.hint);
      const sortPicker = makeElement("select");
      view.sortPicker = sortPicker;
      for (let i = 0; i < SORT_OPTIONS.length; i++) {
        sortPicker.add(new Option(SORT_OPTIONS[i][0], SORT_OPTIONS[i][1]));
      }
      sorter.appendChild(sortPicker);
      head.appendChild(sorter);
      sortPicker.onchange = function () {
        view.sortKey = sortPicker.value;
        view.sortDescending = true;
        applySort(view);
      };

      // the line above the chart: title in the middle, time frame dropdown on the right
      const chartHead = makeElement("div", "", "chart-head");
      view.chartTitle = makeElement("div", "", "chart-title");
      const timeLabel = makeElement("label", "Time frame", "time-picker");
      view.timePicker = makeElement("select");
      for (let i = 0; i < TIME_OPTIONS.length; i++) {
        view.timePicker.add(new Option(TIME_OPTIONS[i][0], TIME_OPTIONS[i][1]));
      }
      view.timePicker.value = "0";   // start with all the data
      timeLabel.appendChild(view.timePicker);
      chartHead.appendChild(makeElement("div"));   // empty left cell keeps the title in the middle
      chartHead.appendChild(view.chartTitle);
      chartHead.appendChild(timeLabel);

      const wrap = makeElement("div", "", "table-wrap");
      wrap.appendChild(table);
      section.appendChild(wrap);
      section.appendChild(makeElement("p",
        "Open means the last close is at or below the optimal SMA, the buy rule from the backtest. " +
        "Closed means it is above. Click a row to show its chart.", "muted"));
      section.appendChild(view.picker);
      section.appendChild(chartHead);
      section.appendChild(view.chart);
      section.appendChild(view.beatLine);

      view.picker.onchange = function () {
        drawChart(view);
      };
      view.timePicker.onchange = function () {
        drawChart(view);
      };
      drawChart(view);
    }


    function showPage(data) {
      document.getElementById("updated").textContent = "Updated " + data.updated + " from the daily closing prices.";
      const sections = document.getElementById("sections");
      for (let i = 0; i < data.groups.length; i++) {
        addSection(sections, data.groups[i]);
      }
    }


    fetch("data.json", { cache: "no-store" })
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        showPage(data);
      })
      .catch(function (error) {
        document.getElementById("updated").textContent =
          "Could not load the dashboard (" + error.message + "). If you opened this file directly, " +
          "run: python -m http.server (inside the docs folder) and open http://localhost:8000.";
      });
  </script>
</body>
</html>
